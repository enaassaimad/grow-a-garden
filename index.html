        --border: #374151; /* Gray 700 */
      }

      html.theme-nature {
        --background: #f0fdf4; /* Green 50 */

        --primary: #22c55e; /* Green 500 */
        --primary-foreground: #ffffff;

        --card: #ffffff;
        --card-foreground: #14532d;
        --border: #bbf7d0; /* Green 200 */

      html.theme-dark {
        --background: #111827; /* Gray 900 */
        --foreground: #D1D5DB; /* Gray 300 */
        --primary: #22c55e; /* Green 500 */
        --primary-foreground: #ffffff;
        --secondary: #374151; /* Gray 700 */
        --secondary-foreground: #E5E7EB; /* Gray 200 */
        --accent: #10b981; /* Emerald 500 */
        --accent-foreground: #ffffff;
        --card: #1f2937; /* Gray 800 */
        --card-foreground: #F9FAFB; /* Gray 50 */
        --border: #374151; /* Gray 700 */
      }
      
      html.theme-pastel {
        --background: #FFF7ED; /* Orange 50 */
        --foreground: #7C2D12; /* Orange 900 */
        --primary: #FB923C; /* Orange 400 */
        --primary-foreground: #431407; /* Orange 950 */
        --secondary: #FED7AA; /* Orange 200 */
        --secondary-foreground: #7C2D12; /* Orange 900 */
        --accent: #FDBA74; /* Orange 300 */
        --accent-foreground: #431407;
        --card: #FFFAF0; /* Floral White */
        --card-foreground: #7C2D12;
        --border: #FFE4E1; /* Misty Rose */
      }

      html.theme-minimalist {
        --background: #F9FAFB; /* Gray 50 */
        --foreground: #1F2937; /* Gray 800 */
        --primary: #374151; /* Gray 700 */
        --primary-foreground: #FFFFFF;
        --secondary: #E5E7EB; /* Gray 200 */
        --secondary-foreground: #1F2937;
        --accent: #6B7280; /* Gray 500 */
        --accent-foreground: #FFFFFF;
        --card: #FFFFFF;
        --card-foreground: #111827; /* Gray 900 */
        --border: #D1D5DB; /* Gray 300 */
      }
      
      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.3s, color 0.3s;
      }
      
      /* Pre-React Loader Styles */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--background);
        color: var(--foreground);
        position: fixed;
        inset: 0;
        z-index: 9999;
        font-family: sans-serif;
      }
      @keyframes pulse {
          50% { opacity: .6; }
      }
      .loading-screen .pulse-icon {
          width: 3rem; /* 48px */
          height: 3rem; /* 48px */
          color: var(--primary);
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loading-screen .loading-text {
          margin-top: 1rem;
          font-size: 1.125rem; /* 18px */
          font-weight: 600;
          opacity: 0.9;
      }
    </style>
